<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>海创｜客商申请小程序原型</title>
  <style>
    :root {
      --wx-blue: #1594ee;
      --wx-blue-dark: #087dd5;
      --label-blue: #278fc9;
      --page-bg: #f4f7f9;
      --control-bg: #f6f7f8;
      --line: #d7e0e7;
      --text: #252c32;
      --muted: #87919a;
      --danger: #d95d65;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; background: var(--page-bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .app-shell { position: relative; width: min(100%, 640px); min-height: 100vh; margin: 0 auto; background: #fff; box-shadow: 0 0 24px rgba(25, 52, 74, .08); }
    .page { display: none; min-height: 100vh; background: #fff; }
    .page.active { display: block; }
    .mp-header { position: sticky; top: 0; z-index: 20; min-height: calc(56px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 18px 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #118ff0 0%, #087fdf 100%); color: #fff; }
    .mp-title { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
    .form-page .mp-title { font-size: 18px; letter-spacing: 0; }
    .mp-actions { position: absolute; right: 16px; top: calc(env(safe-area-inset-top) + 12px); display: flex; align-items: center; gap: 13px; color: #fff; }
    .mini-menu { width: 76px; height: 36px; display: flex; align-items: center; justify-content: space-around; border: 1px solid rgba(255,255,255,.35); border-radius: 20px; background: rgba(2, 88, 172, .42); font-size: 17px; }
    .mini-menu .divide { width: 1px; height: 22px; background: rgba(255,255,255,.35); }
    .back { position: absolute; left: 12px; top: calc(env(safe-area-inset-top) + 9px); width: 36px; height: 38px; color: #fff; background: transparent; font-size: 38px; font-weight: 200; line-height: 30px; }
    .home-body { padding: 66px 18px 108px; }
    .home-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 22px; }
    .home-card { position: relative; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 11px; border-radius: 10px; color: #fff; overflow: hidden; box-shadow: 0 5px 12px rgba(32, 90, 130, .12); transition: transform .18s ease, box-shadow .18s ease; }
    .home-card:active { transform: scale(.98); box-shadow: 0 2px 6px rgba(32, 90, 130, .16); }
    .home-card h2 { margin: 0; font-size: 21px; font-weight: 500; }
    .home-card .card-icon { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 14px; color: rgba(255,255,255,.95); font-size: 39px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.12); }
    .quote { background: linear-gradient(150deg, #88eabd, #19b8d3); }
    .rate { background: linear-gradient(150deg, #45bee8, #178add); }
    .order { background: linear-gradient(150deg, #ff6713, #f13e5b); }
    .query { background: linear-gradient(150deg, #7de9bd, #1ab4d4); }
    .partner { background: linear-gradient(150deg, #6ec5ff, #247fe0); }
    .preview-tabs { position: sticky; top: calc(56px + env(safe-area-inset-top)); z-index: 19; display: flex; padding: 0 18px; background: #fff; border-bottom: 1px solid #e5edf3; }
    .preview-tabs button { flex: 1; min-height: 46px; border-bottom: 3px solid transparent; color: #71808d; background: #fff; font-size: 16px; }
    .preview-tabs button.active { border-bottom-color: var(--wx-blue); color: var(--wx-blue-dark); font-weight: 600; }
    .form-footer { gap: 10px; }
    .approval-page { background: var(--page-bg); }
    .approval-body { padding: 14px 12px 100px; }
    .approval-types { display: flex; gap: 6px; margin-bottom: 12px; }
    .approval-types button { flex: 1; min-height: 42px; padding: 8px 4px; border: 1px solid #dbe6ee; border-radius: 6px; color: #607384; background: #fff; }
    .approval-types button.active { color: var(--wx-blue-dark); background: #eaf6ff; border-color: var(--wx-blue); font-weight: 600; }
    .approval-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 14px; color: var(--muted); font-size: 12px; }
    .approval-toolbar select { max-width: 120px; padding: 6px; border: 1px solid var(--line); border-radius: 4px; color: #4d6374; background: #fff; }
    .approval-card { padding: 18px 14px; margin-bottom: 12px; border-radius: 8px; background: #fff; }
    .approval-card h2 { margin: 0 0 14px; color: #263b4a; font-size: 16px; }
    .approval-hero { display: flex; gap: 12px; align-items: flex-start; }
    .approval-avatar { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 8px; background: #e5f3ff; color: var(--wx-blue-dark); font-size: 23px; }
    .approval-heading { min-width: 0; }
    .approval-heading h1 { margin: 0 0 8px; font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; }
    .approval-status { padding: 3px 7px; color: #168444; background: #e6f7ed; border-radius: 3px; font-size: 12px; }
    .approval-status.pending { color: #bb7a0b; background: #fff4d8; }
    .approval-row { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; margin: 15px 0; line-height: 1.7; }
    .approval-row:last-child { margin-bottom: 0; }
    .approval-label { color: #8593a0; }
    .approval-value { min-width: 0; color: #263846; overflow-wrap: anywhere; }
    .approval-contact + .approval-contact { margin-top: 16px; padding-top: 10px; border-top: 1px solid #edf1f4; }
    .approval-contact h3 { font-size: 14px; color: #617b8d; }
    .approval-file { width: 100%; padding: 10px; border-radius: 5px; color: #3d5465; background: #f3f6f8; text-align: left; overflow-wrap: anywhere; }
    .approval-timeline { padding-left: 0; }
    .approval-node { position: relative; padding: 0 0 24px 35px; }
    .approval-node:not(:last-child)::before { content: ''; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: #b9d9fa; }
    .approval-node:last-child { padding-bottom: 0; }
    .node-icon { position: absolute; left: 0; top: 2px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; background: #4999f3; }
    .node-icon svg { width: 17px; height: 17px; }
    .node-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; width: 100%; min-height: 36px; padding: 0; text-align: left; color: #213747; background: transparent; font-size: 16px; font-weight: 600; }
    .node-sign { padding: 0 5px; border: 1px solid #b9d4ff; border-radius: 3px; color: #347fe9; background: #f5f9ff; font-size: 12px; font-weight: 400; }
    .node-chevron { color: #bbc3cb; font-size: 14px; }
    .node-heading[aria-expanded="false"] .node-chevron { transform: rotate(180deg); }
    .approval-people { padding-top: 10px; }
    .approval-person { display: flex; align-items: flex-start; gap: 10px; min-width: 0; padding: 8px 0; }
    .person-avatar { position: relative; flex: none; display: grid; place-items: center; width: 38px; height: 42px; border-radius: 5px; color: #4e6f8b; background: #eaf1f7; font-size: 13px; font-weight: 600; }
    .person-avatar.tone-1 { color: #73628c; background: #f0ebf6; }
    .person-avatar.tone-2 { color: #527e72; background: #e7f4ef; }
    .person-avatar.tone-3 { color: #9b7351; background: #fbf0e5; }
    .person-approved { position: absolute; right: -5px; top: -5px; display: grid; place-items: center; width: 17px; height: 17px; border: 2px solid #fff; border-radius: 50%; color: #fff; background: #2886ef; font-size: 10px; }
    .person-info { flex: 1; min-width: 0; }
    .person-line { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 5px 12px; min-height: 42px; }
    .person-name { color: #233e52; font-size: 15px; }
    .person-status { color: #8998a5; font-size: 12px; }
    .person-comment { margin: 2px 0 5px; color: #8799a6; font-size: 12px; line-height: 1.6; }
    .approval-foot { position: fixed; bottom: 0; z-index: 18; width: min(100%, 640px); padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #e5edf3; background: #fff; }
    .approval-foot button { width: 100%; min-height: 44px; border-radius: 6px; background: #f2f5f7; color: #3c5364; font-size: 16px; }
    .home-footer { position: fixed; z-index: 10; bottom: 0; width: min(100%, 640px); height: 72px; display: flex; align-items: center; justify-content: space-around; border-top: 1px solid #edf0f2; background: rgba(250,252,253,.97); }
    .home-footer button { width: 100px; color: #8b949d; background: transparent; font-size: 14px; }
    .home-footer button.active { color: var(--wx-blue-dark); }
    .home-footer .nav-icon { display: block; margin: 0 auto 1px; font-size: 27px; line-height: 28px; }

    .form-page { background: var(--page-bg); }
    .form-scroll { padding: 18px 14px 24px; }
    .form-card { padding: 20px 12px 30px; background: #fff; border-radius: 4px; }
    .section-title { display: flex; align-items: center; gap: 10px; margin: 0 0 21px; font-size: 23px; line-height: 1.2; font-weight: 700; }
    .section-title::before { content: ""; width: 5px; height: 37px; border-radius: 1px; background: var(--wx-blue); }
    .section-title.compact { margin-top: 25px; margin-bottom: 13px; font-size: 18px; }
    .section-title.compact::before { width: 4px; height: 25px; }
    .field { margin-bottom: 18px; }
    .field label, .group-label { display: block; margin-bottom: 9px; color: var(--label-blue); font-size: 17px; font-weight: 600; }
    .required::before { content: "*"; margin-right: 5px; color: #d84c52; }
    .field select, .field input:not([type="checkbox"]), .field textarea { width: 100%; min-height: 46px; padding: 0 13px; border: 0; border-radius: 5px; outline: none; background: var(--control-bg); color: #3c454d; font-size: 16px; }
    .field select:focus, .field input:focus, .field textarea:focus { box-shadow: 0 0 0 2px rgba(21,148,238,.18); }
    .field textarea { min-height: 120px; padding-top: 11px; padding-bottom: 28px; resize: vertical; }
    .field input:disabled { color: #858d94; }
    .select-wrap { position: relative; }
    .select-wrap::after { content: "›"; position: absolute; right: 18px; top: 8px; transform: rotate(90deg); color: #8b9399; font-size: 27px; pointer-events: none; }
    .select-wrap select { appearance: none; padding-right: 45px; }
    .two-col { display: block; }
    .two-col .field { min-width: 0; }
    .check-group { margin: 1px 0 20px; }
    .multi-picker-trigger { width: 100%; min-height: 46px; padding: 11px 42px 11px 13px; border: 0; border-radius: 5px; color: #64717a; background: var(--control-bg); text-align: left; position: relative; overflow-wrap: anywhere; font-size: 16px; }
    .multi-picker-trigger::after { content: "›"; position: absolute; right: 17px; top: 8px; transform: rotate(90deg); color: #8b9399; font-size: 27px; }
    .multi-picker-trigger.has-value { color: #3c454d; }
    .picker-source { display: none; }
    .contact-rows { display: grid; gap: 12px; }
    .contact-row { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .contact-row-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .contact-number { font-weight: 600; color: #53616d; }
    .contact-row .field { margin-bottom: 13px; }
    .contact-row .field:last-child { margin-bottom: 0; }
    .contact-row .field label, .contact-row .group-label { font-size: 14px; }
    .contact-actions { display: flex; gap: 8px; }
    .contact-actions button { min-width: 48px; min-height: 40px; padding: 0 8px; border-radius: 4px; color: var(--wx-blue-dark); background: #edf7ff; }
    .contact-actions .remove { color: #d95d65; background: #fff1f1; }
    .service-tools { display: flex; gap: 8px; margin-bottom: 8px; }
    .service-tools button { min-width: 58px; height: 32px; border-radius: 4px; color: #fff; background: var(--wx-blue-dark); }
    .service-tools .danger { background: #e86b71; }
    .service-table { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
    .service-table table { width: 100%; min-width: 470px; border-collapse: collapse; color: #5c6871; font-size: 12px; }
    .service-table th, .service-table td { height: 36px; padding: 0 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    .service-table th { background: #f0f4f7; font-weight: 600; }
    .service-table td:last-child, .service-table th:last-child { border-right: 0; }
    .service-table tr:last-child td { border-bottom: 0; }
    .empty { height: 80px !important; text-align: center !important; color: #87919a; }
    .upload-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .upload-row label { margin: 0; }
    .upload-btn { flex: 0 0 auto; min-width: 64px; height: 35px; border-radius: 4px; color: #fff; background: var(--wx-blue-dark); }
    .counter { margin-top: -25px; padding-right: 11px; text-align: right; color: #87919a; pointer-events: none; }
    .form-footer { position: sticky; bottom: 0; z-index: 15; display: flex; justify-content: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #e1e7eb; background: rgba(255,255,255,.97); }
    .submit-btn { width: 100%; height: 49px; border-radius: 28px; color: #fff; background: var(--wx-blue); font-size: 18px; font-weight: 600; box-shadow: 0 5px 13px rgba(21,148,238,.22); }
    .submit-btn:active { background: var(--wx-blue-dark); }
    .toast { position: fixed; z-index: 70; left: 50%; bottom: 94px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; max-width: calc(100% - 40px); padding: 10px 16px; border-radius: 6px; color: #fff; background: rgba(33, 44, 52, .92); transition: all .2s ease; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .invalid-field { box-shadow: 0 0 0 2px rgba(217,93,101,.35) !important; }
    .dialog-backdrop { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(25, 39, 50, .46); }
    .dialog-backdrop.open { display: flex; }
    .dialog { width: min(330px, calc(100vw - 48px)); padding: 24px 20px 18px; border-radius: 12px; background: #fff; box-shadow: 0 16px 42px rgba(20, 42, 62, .22); text-align: center; }
    .dialog-title { margin-bottom: 10px; font-size: 20px; font-weight: 700; color: #26343d; }
    .dialog-message { margin: 0 0 20px; color: #5f6d77; line-height: 1.7; }
    .dialog-confirm { width: 100%; height: 42px; border-radius: 22px; color: #fff; background: var(--wx-blue); font-size: 16px; font-weight: 600; }
    .sheet-backdrop { position: fixed; inset: 0; z-index: 60; display: none; align-items: flex-end; background: rgba(25, 39, 50, .42); }
    .sheet-backdrop.open { display: flex; }
    .multi-sheet { width: min(100%, 640px); max-height: 78vh; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); border-radius: 16px 16px 0 0; background: #fff; box-shadow: 0 -10px 32px rgba(24, 53, 75, .22); }
    .sheet-header { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e3e9ed; }
    .sheet-header button { padding: 6px 4px; color: var(--wx-blue-dark); background: transparent; font-size: 15px; }
    .sheet-header strong { font-size: 17px; }
    .sheet-list { max-height: 58vh; overflow-y: auto; padding: 12px 16px 18px; }
    .sheet-option { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 10px; border-bottom: 1px solid #edf1f3; color: #46515a; }
    .sheet-option input { width: 19px; height: 19px; margin: 0; flex: none; accent-color: var(--wx-blue); }
    .sheet-option span { overflow-wrap: anywhere; }
    @media (max-width: 520px) {
      .home-body { padding: 48px 15px 102px; }
      .home-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; }
      .home-card { min-height: 148px; }
      .home-card h2 { font-size: 18px; }
      .home-card .card-icon { width: 56px; height: 56px; font-size: 33px; }
      .form-scroll { padding: 10px 9px 18px; }
      .form-card { padding: 17px 10px 20px; }
      .section-title { margin-bottom: 18px; font-size: 21px; }
      .section-title::before { height: 31px; }
      .field label, .group-label { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <section class="page active" id="home-page">
      <header class="mp-header"><div class="mp-title">海创</div><div class="mp-actions"><div class="mini-menu"><span>•••</span><span class="divide"></span><span>◉</span></div></div></header>
      <nav class="preview-tabs" aria-label="原型页面切换"><button type="button" class="active" data-view="application">客商申请</button><button type="button" data-view="approval">审批页</button></nav>
      <main class="home-body">
        <div class="home-grid">
          <button class="home-card quote"><span class="card-icon">¥</span><h2>询价管理</h2></button>
          <button class="home-card rate"><span class="card-icon">▰</span><h2>运价查询</h2></button>
          <button class="home-card order"><span class="card-icon">＋</span><h2>在线下单</h2></button>
          <button class="home-card query"><span class="card-icon">▤</span><h2>订单查询</h2></button>
          <button class="home-card partner" data-open="partner-page"><span class="card-icon">♙</span><h2>客商申请</h2></button>
        </div>
      </main>
      <nav class="home-footer"><button class="active"><span class="nav-icon">⌂</span>首页</button><button><span class="nav-icon">♙</span>我的</button></nav>
    </section>

    <section class="page form-page" id="partner-page">
      <header class="mp-header"><button class="back" data-back="home-page" aria-label="返回">‹</button><div class="mp-title">新增客商申请</div><div class="mp-actions"><div class="mini-menu"><span>•••</span><span class="divide"></span><span>◉</span></div></div></header>
      <nav class="preview-tabs" aria-label="原型页面切换"><button type="button" class="active" data-view="application">客商申请</button><button type="button" data-view="approval">审批页</button></nav>
      <main class="form-scroll"><form class="form-card" id="partner-form" novalidate>
        <h1 class="section-title">基础信息</h1>
        <div class="field" id="partner-type-picker" data-picker-group="partner-type" data-required-group>
          <label class="group-label required" id="partner-type-label">客商类型</label>
          <button type="button" class="multi-picker-trigger" data-placeholder="请选择客商类型" aria-labelledby="partner-type-label partner-type-trigger" id="partner-type-trigger" aria-haspopup="dialog" aria-expanded="false">客户</button>
          <div class="picker-source"><label><input type="checkbox" name="partnerType" value="客户" checked />客户</label><label><input type="checkbox" name="partnerType" value="供应商" />供应商</label></div>
        </div>
        <div class="field"><label class="required" for="region">国内/境外</label><div class="select-wrap"><select id="region" name="region" required><option value="">请选择</option><option>国内</option><option>境外</option></select></div></div>
        <div class="field"><label class="required" for="chinese-name">中文名称</label><input id="chinese-name" name="chineseName" required placeholder="请输入中文名称" /></div>
        <div class="field"><label class="required" for="short-name">简称</label><input id="short-name" name="shortName" required placeholder="请输入简称" /></div>
        <div class="field"><label class="required" for="english-name">英文名称</label><input id="english-name" name="englishName" required placeholder="请输入英文名称" /></div>
        <div class="field customer-only"><label class="required" for="overseas-warehouse">含海外仓</label><div class="select-wrap"><select id="overseas-warehouse" name="overseasWarehouse" data-customer-required required><option value="">请选择</option><option>是</option><option>否</option></select></div></div>
        <div class="field"><label class="required" for="is-peer">是否同行</label><div class="select-wrap"><select id="is-peer" name="isPeer" required><option value="">请选择</option><option>是</option><option>否</option></select></div></div>
        <div class="field customer-only"><label class="required" for="customer-level">客户级别</label><div class="select-wrap"><select id="customer-level" name="customerLevel" data-customer-required required><option value="">请选择</option><option>S类</option><option>A类</option><option>B类</option></select></div></div>
        <div class="field"><label class="required" for="address">地址</label><input id="address" name="address" required placeholder="请输入地址" /></div>
        <div class="field customer-only"><label class="required" for="trade-type">贸易类型</label><input id="trade-type" name="tradeType" data-customer-required required placeholder="请输入关键词" /></div>
        <div class="field customer-only"><label for="payment-term">账期</label><div class="select-wrap"><select id="payment-term" name="paymentTerm"><option>票结</option><option>月结</option></select></div></div>
        <div class="field customer-only"><label for="credit-limit">额度</label><input id="credit-limit" name="creditLimit" type="number" min="0" value="0" /></div>
        <div class="field"><label class="required" for="contract-status">签订合同</label><div class="select-wrap"><select id="contract-status" name="contractStatus" required><option value="未签订" selected>未签订</option><option value="已签订">已签订</option></select></div></div>
        <div class="field" id="contract-date-field"><label class="required" for="contract-deadline">最迟签订合同日期</label><input id="contract-deadline" name="contractDeadline" type="date" required /></div>
        <div class="check-group" data-picker-group="partner-role">
          <div class="group-label" id="partner-role-label">角色</div>
          <button type="button" id="partner-role-trigger" class="multi-picker-trigger" data-placeholder="请选择角色" aria-labelledby="partner-role-label partner-role-trigger" aria-haspopup="dialog" aria-expanded="false">客户</button>

t type="checkbox" name="partnerRole" value="发运代理" disabled />发运代理</label><label class="supplier-role-option" hidden><input type="checkbox" name="partnerRole" value="装货地公司" disabled />装货地公司</label><label class="supplier-role-option" hidden><input type="checkbox" name="partnerRole" value="签单地公司" disabled />签单地公司</label><label class="supplier-role-option" hidden><input type="checkbox" name="partnerRole" value="码头公司" disabled />码头公司</label><label class="supplier-role-option" hidden><input type="checkbox" name="partnerRole" value="卸货港公司" disabled />卸货港公司</label><label class="supplier-role-option" hidden><input type="checkbox" name="partnerRole" value="目的港公司" disabled />目的港公司</label><label class="supplier-role-option" hidden><input type="checkbox" name="partnerRole" value="贸易商" disabled />贸易商</label><label class="supplier-role-option" hidden><input type="checkbox" name="partnerRole" value="工厂/生产商" disabled />工厂/生产商</label><label class="supplier-role-option" hidden><input type="checkbox" name="partnerRole" value="其他" disabled />其他</label></div>

  <script>
    (() => {
      const form = document.getElementById('partner-form');
      const typePicker = document.getElementById('partner-type-picker');
      const contactList = document.getElementById('contact-list');
      const contractStatus = document.getElementById('contract-status');
      const contractDateField = document.getElementById('contract-date-field');
      const contractDeadline = document.getElementById('contract-deadline');
      const applicationContent = document.getElementById('application-content');
      const sheet = document.getElementById('multi-sheet');
      const sheetList = document.getElementById('sheet-list');
      const successDialog = document.getElementById('success-dialog');
      const toast = document.getElementById('toast');
      let toastTimer;
      let contactId = 0;
      let activePicker = null;
      let draftInputs = [];
      let lastApplicationPage = 'home-page';
      let approvalType = 'both';
      const approvalFields = [
        ['region', '国内/境外', 'all'], ['chineseName', '中文名称', 'all'],
        ['shortName', '简称', 'all'], ['englishName', '英文名称', 'all'],
        ['overseasWarehouse', '含海外仓', 'customer'], ['isPeer', '是否同行', 'all'],
        ['customerLevel', '客户级别', 'customer'], ['address', '地址', 'all'],
        ['tradeType', '贸易类型', 'customer'], ['paymentTerm', '账期', 'customer'],
        ['creditLimit', '额度', 'customer'], ['contractStatus', '签订合同', 'all'],
        ['contractDeadline', '最迟签订合同日期', 'unsigned'], ['partnerRole', '角色', 'all'],
        ['businessType', '相关业务类型', 'all']
      ];
      const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
      function approvalRow(label, value) {
        const text = Array.isArray(value) ? value.join('、') : value;
        return '<div class="approval-row" data-field="' + escapeHtml(label) + '"><div class="approval-label">' + escapeHtml(label) + '</div><div class="approval-value">' + escapeHtml(text === '' || text == null ? '未填写' : text) + '</div></div>';
      }
      function approvalCard(title, body) { return '<section class="approval-card"><h2>' + title + '</h2>' + body + '</section>'; }
      function makeExample(type) {
        const customer = type !== 'supplier';
        const supplier = type !== 'customer';
        const identities = customer ? (supplier ? ['客户', '供应商'] : ['客户']) : ['供应商'];
        const number = type === 'customer' ? '001' : type === 'supplier' ? '002' : '003';
        const company = type === 'customer' ? '华澜贸易（演示）有限公司' : type === 'supplier' ? '远川物流（演示）有限公司' : '海辰供应链（演示）有限公司';
        return {
          partnerType: identities,
          region: '国内', chineseName: company, shortName: type === 'customer' ? '华澜贸易' : type === 'supplier' ? '远川物流' : '海辰供应链',
          englishName: type === 'customer' ? 'HUALAN TRADING DEMO CO., LTD.' : type === 'supplier' ? 'YUANCHUAN LOGISTICS DEMO CO., LTD.' : 'HAICHEN SUPPLY CHAIN DEMO CO., LTD.',
          overseasWarehouse: '是', isPeer: type === 'customer' ? '否' : '是', customerLevel: 'A类',
          address: '浙江省杭州市拱墅区运河商务中心 A 座 1206 室（演示地址）',
          tradeType: '一般贸易/跨境电商', paymentTerm: '月结', creditLimit: type === 'both' ? '200000' : '100000',
          contractStatus: customer ? '未签订' : '已签订', contractDeadline: '2026-12-31',
          partnerRole: customer ? (supplier ? ['客户', '船代', '仓库'] : ['客户']) : ['船代', '仓库'],
          businessType: customer ? ['海运出口', '空运出口', '综合物流'] : ['海运出口', '空运出口'],
          contacts: [
            { contactName: '陆清禾', contactPartnerType: [customer ? '客户' : '供应商'], contactPhone: '13800000001', contactEmail: 'lu.qinghe@example.com' },
            { contactName: '苏星遥', contactPartnerType: [supplier ? '供应商' : '客户'], contactPhone: '13800000002', contactEmail: 'su.xingyao@example.com' }
          ],
          services: customer ? [
            { '岗位类型': '销售', '业务类型': '海运出口', '用户': '周明轩', '是否默认': '是', '备注': '负责华东区域合作客户' },
            { '岗位类型': '客服', '业务类型': '空运出口', '用户': '许嘉宁', '是否默认': '是', '备注': '负责订单及业务对接' }
          ] : [],
          applicationContent: type === 'customer' ? '拟开展华东地区出口运输合作，申请建立客户档案，月结额度 10 万元，合同拟于 12 月底前完成签订。' : type === 'supplier' ? '拟委托开展海运订舱及仓储服务，合作合同已签订，供应商档案与资质资料已提交，请审批。' : '该合作方同时提供物流服务并采购出口运输服务，申请建立客户及供应商双身份，客户月结额度 20 万元，共享联系人及基础资料。',
          source: document.getElementById('approval-source').value, applicant: '沈亦凡', department: '华东业务部（演示）',
          applicationNo: 'KS-DEMO-20261128-' + number, approvalNo: 'DEMO-20261128-' + number,
          submittedAt: '2026/11/28 09:10', status: '已通过',
          supplement: { '负责销售人员': '周明轩', '是否属于DDP': '否', '是否可签订合同': '是' },
          flow: {
            approvers: [
              { name: '陈思远' }, { name: '林知行' },
              { name: '周明轩', status: '已同意', time: '11/28 09:26', opinion: '资料齐全，同意按本次申请内容办理。' },
              { name: '许嘉宁' }
            ],
            copied: [{ name: '林知行', status: '已抄送', time: '11/28 09:26' }]
          }
        };
      }
      function renderApprovalFlow(data) {
        const userIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M6 20v-3a6 6 0 0 1 12 0v3M4 20h16"/></svg>';
        const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 10 18-7-7 18-3-8-8-3Z"/><path d="m11 13 10-10"/></svg>';
        function people(records, copied) {
          return records.map((person, index) => {
            const statusField = copied ? '抄送状态' : '节点状态';
            const timeField = copied ? '抄送时间' : '处理时间';
            const completed = person.status === '已同意';
            const status = person.status ? '<span class="person-status"><span data-field="' + statusField + '">' + escapeHtml(person.status) + '</span> · <time data-field="' + timeField + '">' + escapeHtml(person.time) + '</time></span>' : '';
            const opinion = person.opinion ? '<p class="person-comment" data-field="审批意见">' + escapeHtml(person.opinion) + '</p>' : '';
            return '<div class="approval-person"><div class="person-avatar tone-' + (index % 4) + '" aria-hidden="true">' + escapeHtml(person.name.slice(-2)) + (completed ? '<span class="person-approved">✓</span>' : '') + '</div><div class="person-info"><div class="person-line"><span class="person-name" data-field="' + (copied ? '抄送人' : '审批人') + '">' + escapeHtml(person.name) + '</span>' + status + '</div>' + opinion + '</div></div>';
          }).join('');
        }
        function node(icon, title, badge, body, id) {
          return '<div class="approval-node"><span class="node-icon">' + icon + '</span><button type="button" class="node-heading" data-node-toggle aria-expanded="true" aria-controls="' + id + '"><span data-field="审批节点">' + title + '</span>' + (badge ? '<span class="node-sign" data-field="审批类型">' + badge + '</span>' : '') + '<span class="node-chevron" aria-hidden="true">▴</span></button><div class="approval-people" data-node-body id="' + id + '">' + body + '</div></div>';
        }
        return approvalCard('审批流程', '<div class="approval-timeline">' + node(userIcon, '审批人 · 已同意', '或签', people(data.flow.approvers, false), 'approval-reviewers') + node(copyIcon, '抄送人 · 已抄送', '', people(data.flow.copied, true), 'approval-copied') + '</div>');
      }
      function renderApproval() {
        const data = makeExample(approvalType);
        const hasCustomer = data.partnerType.includes('客户');
        const hasSupplier = data.partnerType.includes('供应商');
        const type = hasCustomer ? (hasSupplier ? 'both' : 'customer') : 'supplier';
        const titleType = type === 'both' ? '客商申请（客户＋供应商）' : type === 'customer' ? '客户申请' : '供应商申请';
        document.querySelectorAll('[data-approval-type]').forEach(button => {
          const active = button.dataset.approvalType === type;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        document.getElementById('approval-context').textContent = '演示数据 · 仅用于原型展示';
        const hero = '<section class="approval-card approval-hero"><div class="approval-avatar">♙</div><div class="approval-heading"><h1>' + escapeHtml(data.applicant + '的' + titleType + '（' + data.source + '）') + '</h1><span class="approval-status' + (data.status === '已通过' ? '' : ' pending') + '" aria-label="审批状态">' + escapeHtml(data.status) + '</span></div></section>';
        const metadata = [['申请编号', data.applicationNo], ['审批编号', data.approvalNo], ['提交时间', data.submittedAt], ['申请人', data.applicant], ['所在部门', data.department], ['来源', data.source]];
        let basic = approvalRow('客商类型', data.partnerType);
        approvalFields.forEach(([name, label, scope]) => {
          if (scope === 'customer' && !hasCustomer) return;
          if (scope === 'unsigned' && data.contractStatus !== '未签订') return;
          basic += approvalRow(label, data[name]);
        });
        const contacts = data.contacts.map((contact, index) => '<div class="approval-contact"><h3>联系人 ' + (index + 1) + '</h3>' + approvalRow('联系人', contact.contactName) + approvalRow('客商类型', contact.contactPartnerType) + approvalRow('联系电话', contact.contactPhone) + approvalRow('联系邮箱', contact.contactEmail) + '</div>').join('');
        let service = '';
        if (hasCustomer) service = approvalCard('服务客商人员', data.services.length ? data.services.map(record => '<div class="approval-contact">' + Object.entries(record).map(([label, value]) => approvalRow(label, value)).join('') + '</div>').join('') : ['岗位类型', '业务类型', '用户', '是否默认', '备注'].map(label => approvalRow(label, '')).join(''));
        const attachmentLabels = [...(hasCustomer ? ['信控额度自测表', '客户档案', '客户托书'] : []), ...(hasSupplier ? ['供应商档案'] : [])];
        const files = attachmentLabels.map((label, index) => '<div class="approval-row" data-field="' + label + '"><div class="approval-label">' + label + '</div><div class="approval-value"><button type="button" class="approval-file" data-preview-attachment>▧ ' + label + '_' + escapeHtml(data.shortName) + '_20261128.pdf<br><small>' + [140.72, 218.48, 118.36, 256.80][index].toFixed(2) + ' KB</small></button></div></div>').join('');
        const supplement = hasCustomer ? approvalCard('补充信息', ['负责销售人员', '是否属于DDP', '是否可签订合同'].map(label => approvalRow(label, data.supplement[label] || '未提供')).join('')) : '';
        const timeline = renderApprovalFlow(data);
        document.getElementById('approval-content').innerHTML = hero + approvalCard('申请信息', metadata.map(([label, value]) => approvalRow(label, value)).join('')) + approvalCard('基础信息', basic) + approvalCard('客商联系人信息', contacts) + service + approvalCard('申请资料', files + approvalRow('申请内容', data.applicationContent)) + supplement + timeline;
      }
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2300);
      }
      function selectedValues(group) {
        return [...group.querySelectorAll('.picker-source input[type="checkbox"]:checked')].filter(input => !input.disabled).map(input => input.value);
      }
      function selectedPartnerTypes() { return selectedValues(typePicker); }
      function updatePickerTrigger(group) {
        const selected = selectedValues(group);
        const trigger = group.querySelector('.multi-picker-trigger');
        trigger.textContent = selected.length ? selected.join('、') : trigger.dataset.placeholder;
        trigger.classList.toggle('has-value', selected.length > 0);
        if (selected.length) trigger.classList.remove('invalid-field');
      }
      function setRequired(input, required) {
        input.required = required;
        const label = input.closest('.field').querySelector('label');
        label.classList.toggle('required', required);
        if (!required) input.classList.remove('invalid-field');
      }
      function refreshContractDate() {
        const unsigned = contractStatus.value === '未签订';
        contractDateField.hidden = !unsigned;
        contractDeadline.disabled = !unsigned;
        setRequired(contractDeadline, unsigned && selectedPartnerTypes().includes('客户'));
      }
      function refreshContactRequirements(row) {
        const hasCustomer = selectedPartnerTypes().includes('客户');
        row.querySelectorAll('[name="contactName"], [name="contactPhone"]').forEach(input => setRequired(input, hasCustomer));
      }
      function refreshPartnerTypeSections() {
        const values = selectedPartnerTypes();
        const hasCustomer = values.includes('客户');
        const hasSupplier = values.includes('供应商');
        form.querySelectorAll('.customer-only').forEach(element => {
          element.hidden = !hasCustomer;
          element.querySelectorAll('input, select, textarea, button').forEach(input => { input.disabled = !hasCustomer; });
        });
        form.querySelectorAll('[data-customer-required]').forEach(input => setRequired(input, hasCustomer));
        form.querySelectorAll('.supplier-only').forEach(element => { element.hidden = !hasSupplier; });
        setRequired(form.elements.address, hasCustomer);
        setRequired(applicationContent, hasSupplier);
        const roleGroup = form.querySelector('[data-picker-group="partner-role"]');
        roleGroup.querySelectorAll('.picker-source label').forEach(label => {
          const input = label.querySelector('input');
          const isCustomerRole = input.value === '客户';
          const visible = isCustomerRole ? hasCustomer : hasSupplier;
          label.hidden = !visible;
          input.disabled = !visible;
          input.checked = isCustomerRole && hasCustomer && !hasSupplier;
        });
        const comprehensive = form.querySelector('[data-business-option="综合物流"]');
        comprehensive.hidden = !hasCustomer;
        comprehensive.querySelector('input').disabled = !hasCustomer;
        if (!hasCustomer) comprehensive.querySelector('input').checked = false;
        contactList.querySelectorAll('.contact-row').forEach(row => {
          refreshContactRequirements(row);
          const picker = row.querySelector('[data-picker-group]');
          picker.querySelectorAll('.picker-source input').forEach(input => { input.checked = values.includes(input.value); });
          updatePickerTrigger(picker);
        });
        refreshContractDate();
        form.querySelectorAll('[data-picker-group]').forEach(updatePickerTrigger);
      }
      function renumberContacts() {
        contactList.querySelectorAll('.contact-row').forEach((row, index) => {
          row.querySelector('.contact-number').textContent = '联系人 ' + (index + 1);
          row.querySelector('.add').setAttribute('aria-label', '在联系人 ' + (index + 1) + ' 后新增');
          row.querySelector('.remove').setAttribute('aria-label', '删除联系人 ' + (index + 1));
        });
      }
      function addContact(sourceRow) {
        const id = ++contactId;
        const row = document.createElement('div');
        row.className = 'contact-row';
        row.innerHTML = [
          '<div class="contact-row-header"><span class="contact-number"></span><div class="contact-actions"><button type="button" class="add">新增</button><button type="button" class="remove">删除</button></div></div>',
          '<div class="field"><label for="contact-name-' + id + '">联系人</label><input id="contact-name-' + id + '" name="contactName" placeholder="请输入联系人" /></div>',
          '<div class="field" data-picker-group="contact-type-' + id + '"><div class="group-label" id="contact-type-label-' + id + '">客商类型</div><button type="button" class="multi-picker-trigger" id="contact-type-trigger-' + id + '" aria-labelledby="contact-type-label-' + id + ' contact-type-trigger-' + id + '" data-placeholder="请选择客商类型" aria-haspopup="dialog" aria-expanded="false">请选择客商类型</button><div class="picker-source"><label><input type="checkbox" name="contactPartnerType" value="客户" />客户</label><label><input type="checkbox" name="contactPartnerType" value="供应商" />供应商</label></div></div>',
          '<div class="field"><label for="contact-phone-' + id + '">联系电话</label><input id="contact-phone-' + id + '" name="contactPhone" type="tel" placeholder="请输入联系电话" /></div>',
          '<div class="field"><label for="contact-email-' + id + '">联系邮箱</label><input id="contact-email-' + id + '" name="contactEmail" type="email" placeholder="请输入联系邮箱" /></div>'
        ].join('');
        row.querySelectorAll('[name="contactPartnerType"]').forEach(input => { input.checked = selectedPartnerTypes().includes(input.value); });
        if (sourceRow) sourceRow.after(row); else contactList.appendChild(row);
        refreshContactRequirements(row);
        updatePickerTrigger(row.querySelector('[data-picker-group]'));
        renumberContacts();
        if (sourceRow) row.querySelector('[name="contactName"]').focus();
      }
      function showPage(pageId) {
        if (pageId !== 'approval-page') lastApplicationPage = pageId;
        document.querySelectorAll('.page').forEach(page => page.classList.toggle('active', page.id === pageId));
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
      function openPicker(group) {
        activePicker = group;
        draftInputs = [];
        sheetList.replaceChildren();
        document.getElementById('sheet-title').textContent = group.querySelector('.group-label').textContent;
        group.querySelectorAll('.picker-source label').forEach(label => {
          const source = label.querySelector('input');
          if (label.hidden || source.disabled) return;
          const option = document.createElement('label');
          option.className = 'sheet-option';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = source.checked;
          checkbox.value = source.value;
          const text = document.createElement('span');
          text.textContent = label.textContent.trim();
          option.append(checkbox, text);
          sheetList.appendChild(option);
          draftInputs.push({ source, checkbox });
        });
        group.querySelector('.multi-picker-trigger').setAttribute('aria-expanded', 'true');
        sheet.classList.add('open');
        sheet.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        document.getElementById('sheet-cancel').focus();
      }
      function closePicker() {
        const trigger = activePicker?.querySelector('.multi-picker-trigger');
        trigger?.setAttribute('aria-expanded', 'false');
        sheet.classList.remove('open');
        sheet.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        activePicker = null;
        draftInputs = [];
        trigger?.focus({ preventScroll: true });
      }
      function confirmPicker() {
        if (!activePicker) return;
        const isPartnerType = activePicker === typePicker;
        if (isPartnerType && !draftInputs.some(item => item.checkbox.checked)) {
          showToast('至少选择一种客商类型');
          return;
        }
        const changed = draftInputs.some(item => item.source.checked !== item.checkbox.checked);
        draftInputs.forEach(item => { item.source.checked = item.checkbox.checked; });
        updatePickerTrigger(activePicker);
        if (isPartnerType && changed) refreshPartnerTypeSections();
        closePicker();
      }
      function validate() {
        let firstInvalid = null;
        form.querySelectorAll('input:not([type="checkbox"]), select, textarea').forEach(input => {
          const invalid = !input.disabled && ((input.required && !input.value.trim()) || !input.validity.valid);
          input.classList.toggle('invalid-field', invalid);
          if (invalid && !firstInvalid) firstInvalid = input;
        });
        form.querySelectorAll('[data-required-group]').forEach(group => {
          const invalid = !selectedValues(group).length;
          const trigger = group.querySelector('.multi-picker-trigger');
          trigger.classList.toggle('invalid-field', invalid);
          if (invalid && !firstInvalid) firstInvalid = trigger;
        });
        if (firstInvalid) {
          showToast('请补充必填信息并检查填写格式');
          firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
          firstInvalid.focus({ preventScroll: true });
          return false;
        }
        return true;
      }
      function closeSuccess() {
        successDialog.classList.remove('open');
        successDialog.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        showPage('home-page');
      }
      document.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => showPage(button.dataset.open)));
      document.querySelectorAll('[data-back]').forEach(button => button.addEventListener('click', () => showPage(button.dataset.back)));
      document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
        if (button.dataset.view === 'application') { showPage(lastApplicationPage); return; }
        if (document.getElementById('partner-page').classList.contains('active')) {
          const types = selectedPartnerTypes();
          approvalType = types.includes('客户') ? (types.includes('供应商') ? 'both' : 'customer') : 'supplier';
          document.getElementById('approval-source').value = '小程序';
        }
        renderApproval(); showPage('approval-page');
      }));
      document.querySelectorAll('[data-approval-type]').forEach(button => button.addEventListener('click', () => {
        approvalType = button.dataset.approvalType; renderApproval();
      }));
      document.getElementById('approval-source').addEventListener('change', renderApproval);
      document.getElementById('approval-discuss').addEventListener('click', () => showToast('讨论请在企微审批单中发起'));
      document.getElementById('approval-content').addEventListener('click', event => {
        if (event.target.closest('[data-preview-attachment]')) showToast('演示附件，实际文件以企微审批单据为准');
        const toggle = event.target.closest('[data-node-toggle]');
        if (toggle) {
          const expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          toggle.closest('.approval-node').querySelector('[data-node-body]').hidden = expanded;
        }
      });
      form.addEventListener('click', event => {
        const trigger = event.target.closest('.multi-picker-trigger');
        if (trigger) openPicker(trigger.closest('[data-picker-group]'));
      });
      contactList.addEventListener('click', event => {
        const row = event.target.closest('.contact-row');
        if (event.target.closest('.add')) addContact(row);
        if (event.target.closest('.remove')) {
          if (contactList.children.length === 1) { showToast('至少保留一条联系人信息'); return; }
          row.remove();
          renumberContacts();
        }
      });
      contractStatus.addEventListener('change', refreshContractDate);
      applicationContent.addEventListener('input', () => { document.getElementById('content-counter').textContent = applicationContent.value.length + '/500'; });
      form.addEventListener('input', event => { event.target.classList.remove('invalid-field'); });
      document.getElementById('sheet-cancel').addEventListener('click', closePicker);
      document.getElementById('sheet-confirm').addEventListener('click', confirmPicker);
      sheet.addEventListener('click', event => { if (event.target === sheet) closePicker(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && activePicker) closePicker(); });
      document.getElementById('success-confirm').addEventListener('click', closeSuccess);
      form.addEventListener('submit', event => {
        event.preventDefault();
        if (!validate()) return;
        successDialog.classList.add('open');
        successDialog.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        document.getElementById('success-confirm').focus();
      });
      addContact();
      refreshPartnerTypeSections();
    })();
  </script>
</body>
</html>
