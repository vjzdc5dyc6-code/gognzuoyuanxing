      {code:'HCSEHC26050018',owner:'上海合盛国际物流有限公司',accrual:'否',profit:'124.00',status:'已审核',ship:'',voyage:'',customer:'',date:'2026-05-27',contract:'未签约',risk:'',relation:''},
      {code:'HCSEHC26050017',owner:'杭州汇通物流有限公司',accrual:'否',profit:'87.00',status:'已审核',ship:'',voyage:'',customer:'',date:'2026-05-27',contract:'未签约',risk:'',relation:''}
    ];
    const selected=new Set([0,1,2,3]);let impactRows=[{direction:'increase',amount:'0',currency:'RMB'}];const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
    function renderDataRows(){
      $('#dataBody').innerHTML=records.map((record,index)=>`<tr class="${selected.has(index)?'selected':''}" data-index="${index}"><td class="center"><input class="check row-check" data-index="${index}" type="checkbox" ${selected.has(index)?'checked':''} aria-label="选择 ${record.code}" /></td><td><span class="code">${record.code}<span class="magnify">⌕</span></span></td><td>${record.owner}</td><td></td><td>${record.status}</td><td class="center">${record.accrual}</td><td class="num">${record.profit}</td><td>${record.ship}</td><td>${record.voyage}</td><td>${record.customer}</td><td>${record.date}</td><td>${record.contract}</td><td>${record.risk}</td><td>${record.relation}</td></tr>`).join('');
      $$('.row-check').forEach(check=>check.addEventListener('change',()=>{const index=Number(check.dataset.index);if(check.checked)selected.add(index);else selected.delete(index);check.closest('tr').classList.toggle('selected',check.checked);$('#allCheck').checked=selected.size===records.length}));$('#allCheck').checked=selected.size===records.length;
    }
    function showToast(message,type='info'){const toast=$('#toast');toast.textContent=message;toast.classList.toggle('error',type==='error');toast.classList.toggle('warning',type==='warning');toast.classList.add('show');window.clearTimeout(showToast.timer);showToast.timer=window.setTimeout(()=>toast.classList.remove('show'),type==='error'||type==='warning'?4200:2600)}
    function getSelectedRecords(){return[...selected].sort((a,b)=>a-b).map(index=>records[index])}
    function renderRequestTable(){const chosen=getSelectedRecords();$('#requestCount').textContent=chosen.length;$('#requestBody').innerHTML=chosen.map(record=>`<tr><td>${record.code}</td><td>${record.owner}</td><td>${record.accrual}</td><td>${record.profit}</td></tr>`).join('')}
    function rateFor(currency){return currency==='USD'?7.2:1}
    function renderImpactRows(){
      $('#impactBody').innerHTML=impactRows.map((row,index)=>{const amount=Number(row.amount)||0;const local=amount*rateFor(row.currency);return`<tr data-impact-index="${index}"><td><select class="impact-direction" aria-label="影响方向"><option value="increase" ${row.direction==='increase'?'selected':''}>增加</option><option value="decrease" ${row.direction==='decrease'?'selected':''}>减少</option></select></td><td><input class="impact-amount" type="number" min="0" step="0.01" value="${row.amount}" aria-label="原币金额合计" /></td><td><select class="impact-currency" aria-label="币种"><option value="RMB" ${row.currency==='RMB'?'selected':''}>人民币</option><option value="USD" ${row.currency==='USD'?'selected':''}>美元</option></select></td><td><input type="text" value="${rateFor(row.currency).toFixed(4)}" readonly aria-label="汇率" /></td><td><input class="impact-local" type="number" min="0" step="0.01" value="${local.toFixed(2)}" aria-label="本币金额合计（人民币）" /></td></tr>`}).join('');
      $$('.impact-direction').forEach(select=>select.addEventListener('change',()=>{const index=Number(select.closest('tr').dataset.impactIndex);impactRows[index].direction=select.value}));
      $$('.impact-amount').forEach(input=>input.addEventListener('input',()=>{const index=Number(input.closest('tr').dataset.impactIndex);impactRows[index].amount=input.value;const local=Number(input.value||0)*rateFor(impactRows[index].currency);input.closest('tr').querySelector('.impact-local').value=local.toFixed(2)}));
      $$('.impact-local').forEach(input=>input.addEventListener('input',()=>{const index=Number(input.closest('tr').dataset.impactIndex);const local=Math.max(0,Number(input.value)||0);impactRows[index].amount=(local/rateFor(impactRows[index].currency)).toFixed(2);input.closest('tr').querySelector('.impact-amount').value=impactRows[index].amount}));
      $$('.impact-currency').forEach(select=>select.addEventListener('change',()=>{const index=Number(select.closest('tr').dataset.impactIndex);impactRows[index].currency=select.value;renderImpactRows()}));
    }
    function openUnlock(){const chosen=getSelectedRecords();if(!chosen.length){showToast('请先选择需要申请解锁的业务单据');return}const offending=chosen.filter(record=>record.accrual==='是');if(offending.length){const codes=offending.slice(0,3).map(record=>`【${record.code}】`).join('');const suffix=offending.length>3?'...':'';showToast(`${codes}${suffix}业务单据为已计提状态，请注意是否需操作解锁。`,'warning')}renderRequestTable();impactRows=[{direction:'increase',amount:'0',currency:'RMB'}];renderImpactRows();$('#approvalOwner').value='';$('#reason').value='';$('#reasonCount').textContent='0';$('#unlockOverlay .modal-body').scrollTop=0;$('#unlockOverlay').classList.add('show');$('#unlockOverlay').setAttribute('aria-hidden','false')}
    function closeUnlock(){$('#unlockOverlay').classList.remove('show');$('#unlockOverlay').setAttribute('aria-hidden','true')}
    renderDataRows();renderImpactRows();$('#allCheck').addEventListener('change',event=>{records.forEach((_,index)=>event.target.checked?selected.add(index):selected.delete(index));renderDataRows()});$('#unlockBtn').addEventListener('click',openUnlock);$('#closeModal').addEventListener('click',closeUnlock);$('#cancelUnlock').addEventListener('click',closeUnlock);$('#unlockOverlay').addEventListener('click',event=>{if(event.target===$('#unlockOverlay'))closeUnlock()});$('#reason').addEventListener('input',event=>{$('#reasonCount').textContent=event.target.value.length});$('#submitUnlock').addEventListener('click',()=>{if(!$('#approvalOwner').value){showToast('请选择审批客服/销售后再提交。','error');return}if(!$('#reason').value.trim()){showToast('请输入解锁申请原因后再提交。','error');return}closeUnlock();showToast('解锁申请已提交')});
  </script>
</body>
</html>
